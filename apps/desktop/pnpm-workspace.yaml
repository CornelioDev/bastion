# pnpm settings for the desktop app. pnpm 12 reads its settings from this file
# and from the user's global config.yaml; .npmrc files only provide registry,
# authentication, TLS and proxy settings. The file has no `packages` field, so
# the workspace is this one package: `pnpm --dir apps/desktop ...`, the
# lefthook jobs and the lockfile work as they would without it.
#
# The settings below protect installs from a dependency that is published
# with malware, as recommended in https://pnpm.io/supply-chain-security. The
# values of `minimumReleaseAge`, `strictDepBuilds` and `blockExoticSubdeps`
# are pnpm 12's defaults; they are written out so that they stay on whatever
# the user's global config says.

# Install only versions published at least a day (1440 minutes) ago: a
# malicious release is usually detected and removed within hours. Setting the
# value here also turns on `minimumReleaseAgeStrict`, so that when no version
# in a range is old enough, the install fails instead of taking a newer one.
minimumReleaseAge: 1440

# Dependencies may not run install scripts (preinstall, install, postinstall)
# unless `allowBuilds` lists them, and an install fails when one has a script
# that is not listed. None of the current dependencies needs one. Review a
# package before adding it here.
strictDepBuilds: true
allowBuilds: {}

# Only direct dependencies may come from a Git repository or a tarball URL;
# the dependencies they pull in must come from the registry.
blockExoticSubdeps: true

# Advisories that `pnpm audit` ignores, by ID, only in this project. Accepted by
# the maintainer for T-0.13; review both by 2026-12-02. No tool enforces that
# date. Remove an entry as soon as a version with the fix can be installed.
# scripts/check-npm-audit.spec.mjs lists the same IDs, so a change shows up there too.
auditConfig:
  ignoreGhsas:
    # minimatch 10, through eslint and js-beautify: a slow match on a hostile
    # pattern. Development only, on our own patterns. The latest eslint and
    # js-beautify still ask for minimatch 10, and the fix is in 11.
    - GHSA-g3hv-75wg-m249
    # glob 13, through @vue/test-utils > js-beautify: a timeout that doesn't stop
    # a file walk. Development only, and nothing here passes it an AbortSignal
    # from untrusted input. The latest js-beautify still asks for glob 13, and
    # the fix is in 14.
    - GHSA-3g3m-2fjr-6pw4
