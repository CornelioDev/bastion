# CodeQL static security analysis of the Rust and TypeScript/JavaScript code
# (T-0.18). This is GitHub's "advanced setup", kept apart from ci.yml because
# uploading results needs `security-events: write`. The repository's "default
# setup" for code scanning must stay off: GitHub rejects results from this
# workflow while it is on.
#
# Two jobs, so that code from a pull request never runs next to that permission
# (T-0.13). `analyze` runs CodeQL, which for Rust means running the build.rs files
# and proc macros of the pull request, with `contents: read` only. `upload` holds
# `security-events: write`, has no checkout, and only reads the SARIF file that
# `analyze` left as an artifact. That file can be forged by the code it describes.
# A build.rs or proc macro in a pull request can falsify that pull request's results.
# Once a human has merged one, it runs on `main` too, and can falsify the results
# there. `category` is no guarantee: the upload action keeps an
# `automationDetails.id` already in the file, so a forged file can name another one.
#
# Every action is pinned to a full commit hash, with its version in a comment;
# Dependabot updates both (.github/dependabot.yml).
#
# Nothing is excluded: there is no `paths-ignore`, here or in a CodeQL config, so
# all the repository's code is scanned, tests, scripts and generated UI components
# included. Only what CodeQL leaves out on its own is missing, such as
# node_modules, which this workflow doesn't install. Also, no `paths` filter on
# the triggers: a check that doesn't run would block a pull request once this is
# required.

name: CodeQL

on:
  # Never `pull_request_target`: that one runs with the repository's secrets and
  # write access on code from a fork.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # New queries find new problems in code that has not changed. Mondays, 05:17 UTC.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Windows, like the rest of CI, and for a reason that matters: CodeQL's Rust
    # extractor skips code that `#[cfg]` turns off for the machine it runs on, so
    # on Linux it would not see `#[cfg(windows)]` code, which is what most of
    # keitora-service will be.
    runs-on: windows-latest
    timeout-minutes: 60
    # Not even `security-events: read`, which would let the pull request's code read
    # the repository's alerts. Without it the action warns that it can't ask for its
    # experimental features, and carries on with the defaults.
    permissions:
      contents: read
    strategy:
      # One language failing must not cancel the results of the other.
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `none` is the only build mode these two languages have. For Rust, CodeQL
      # still runs build.rs files and proc macros through rust-analyzer. It needs
      # rustup and cargo, which windows-latest includes.
      - name: Set up CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      # `post-processed-sarif-path` is the form of the results that `upload` needs:
      # the fingerprints that track an alert from one run to the next are computed
      # from the source files, and `upload` has none. The database upload is off
      # because it needs `security-events: write`; alerts don't use it.
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          upload-database: false
          post-processed-sarif-path: ${{ runner.temp }}/sarif

      # Downloadable by anyone, like everything from a public repository's runs.
      # That reveals nothing the public code and CodeQL's public queries don't.
      - name: Keep the results for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/sarif
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload (${{ matrix.language }})
    needs: analyze
    # Each language uploads what it has, even if the other one failed. A language
    # whose analysis failed has no artifact, so its upload fails too.
    #
    # Conditions on this job would skip it for the pull requests below, and a job
    # skipped by its own `if` reports under its unexpanded name, `Upload (${{ matrix.language }})`,
    # which would leave a required `Upload (rust)` pending forever. So this job always
    # runs, and the tolerance is on the upload step.
    if: ${{ !cancelled() }}
    # Windows only so that `checkout_path`, whose default is the workspace, is the
    # path `analyze` used, for any absolute path in the file. This job doesn't read
    # files from it.
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/sarif

      # GitHub can give a pull request from a fork, or from Dependabot, a read-only
      # token whatever this file asks for. Their upload may then be rejected,
      # which must not fail a required check they can do nothing about. Their results
      # stay in the artifact of `analyze`, and in the Security tab once merged and
      # analyzed on `main`. Anywhere else, a rejected upload is a real failure.
      #
      # With no checkout, the action can't read `ref` and `sha` from Git, so they
      # are given: the commit that `analyze` checked out by default.
      - name: Upload to code scanning
        continue-on-error: >-
          ${{ github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif
          category: "/language:${{ matrix.language }}"
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
