name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security vulnerabilities**, don't use this form — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a blocklist with …
        2. Start a strict session …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bastion version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options: ["Windows 11", "Windows 10", "Other"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Timer / sessions", "App blocking", "Website blocking / extension", "Installer", "UI", "Other"]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `%ProgramData%\Bastion\logs`. Remove anything private.
      render: text
